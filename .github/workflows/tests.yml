name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      CI: true
      BASE_URL: https://www.saucedemo.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: .ci/allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-
      - run: npm ci
      - run: npm test -- -Dheadless=true -DretryCount=2
      - if: always() && hashFiles('allure-results/latest/**') != ''
        name: Add Allure metadata
        run: npm run allure:metadata
      - if: always() && hashFiles('allure-results/latest/**') != ''
        name: Add history to Allure results
        run: |
          mkdir -p allure-results/latest/history
          if [ -d .ci/allure-history ]; then cp -R .ci/allure-history/. allure-results/latest/history/; fi
      - if: always()
        run: npm run allure:generate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            target/allure-results
            target/surefire-reports
      - if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - if: always() && hashFiles('allure-report/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4
      - if: always() && hashFiles('allure-report/history/**') != ''
        name: Save Allure history
        run: |
          mkdir -p .ci/allure-history
          cp -R allure-report/history/. .ci/allure-history/
      - if: always() && hashFiles('allure-report/history/**') != ''
        name: Cache Allure history
        uses: actions/cache/save@v4
        with:
          path: .ci/allure-history
          key: allure-history-${{ github.run_id }}
      - if: always()
        name: Print report links
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Allure artifact and logs: ${RUN_URL}"
          echo "GitHub Pages report: ${PAGES_URL}"
          {
            echo "## Test Report Links"
            echo "- [Allure artifact and workflow logs](${RUN_URL})"
            echo "- [GitHub Pages report](${PAGES_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"